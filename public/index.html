<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel de Câmeras</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="viewer">
  <header class="topbar">
    <button id="menu-btn" class="icon-btn" aria-label="Abrir menu" aria-expanded="false" aria-controls="drawer">☰</button>
    <h1>Painel de Câmeras</h1>
    <nav id="layouts" class="segmented" aria-label="Layout da grid"></nav>
    <nav id="pager" class="pager" aria-label="Paginação"></nav>
  </header>

  <aside id="drawer" class="drawer" aria-label="Menu" hidden>
    <div class="drawer-head">
      <strong>Câmeras</strong>
      <a class="btn" href="/config.html">⚙ Configurações</a>
    </div>
    <p class="hint">Arraste ou use ▲▼ para mudar a ordem.</p>
    <ol id="drawer-list" class="cam-list"></ol>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <main id="grid" class="grid"></main>

  <script type="module" src="/app.js"></script>
</body>
</html>
